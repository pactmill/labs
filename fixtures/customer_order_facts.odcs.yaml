apiVersion: v3.2.0
kind: DataContract
id: odc.commerce.customer-order-facts
name: Customer Order Facts
version: 1.2.0
status: active
domain: commerce
dataProduct: dp.commerce.customer-order-facts
description:
  purpose: Curated order facts for analytics, churn features, and support agents
  limitations: Does not include PII email or payment instruments
  usage: BI, feature pipelines, read-only agent tools

schema:
  - name: customer_order_facts
    logicalType: object
    physicalName: ANALYTICS.COMMERCE.CUSTOMER_ORDER_FACTS
    physicalType: table
    description: One row per order_id
    properties:
      - name: order_id
        logicalType: string
        primaryKey: true
        required: true
        description: Stable order identifier
        quality:
          - type: library
            rule: unique
          - type: library
            rule: notNull
      - name: customer_id
        logicalType: string
        required: true
        description: Pseudonymous customer key
        quality:
          - type: library
            rule: notNull
      - name: status
        logicalType: string
        required: true
        description: Order lifecycle status
        quality:
          - type: library
            rule: validValues
            mustBe:
              - placed
              - paid
              - shipped
              - delivered
              - cancelled
      - name: total_cents
        logicalType: integer
        required: true
        description: Order total in cents
        quality:
          - type: library
            rule: notNull
          - type: custom
            description: total_cents must be >= 0
            query: total_cents >= 0
      - name: updated_at
        logicalType: timestamp
        required: true
        description: Last update timestamp UTC

sla:
  - property: freshness
    value: 1
    unit: hours
    element: customer_order_facts
  - property: completeness
    value: 99
    unit: percent
    element: customer_order_facts

team:
  - username: commerce-data
    role: owner
    dateIn: "2026-01-01"

tags:
  - domain:commerce
  - tier:gold
